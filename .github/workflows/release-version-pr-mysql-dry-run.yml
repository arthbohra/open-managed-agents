name: Release version-pr MySQL dry run

# Temporary proof that the version-pr test steps, including Enable KVM,
# actually run. This is not a release:
# - no changesets/action (no Version Packages PR)
# - no npm publish, no git tags
# - no production environment
# - concurrency group is not `release`, so it cannot cancel a live Release run
#
# Delete this file after the green run on this branch.

on:
  push:
    branches:
      - cursor/enable-kvm-release-7288

concurrency:
  group: release-version-pr-mysql-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so changelog diffs work

      - name: Setup pnpm
        # No version pin — reads `packageManager` from root package.json.
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Storage integration tests
        run: pnpm test:integration:storage

      # Same Litebox setup as CI. The two-owner MySQL test aborts the host
      # process on Linux when /dev/kvm is not readable and writable.
      - name: Enable KVM for Litebox
        uses: ./.github/actions/enable-kvm

      - name: MySQL integration tests
        run: pnpm test:integration:mysql
