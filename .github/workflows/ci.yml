name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Full repository tests plus browser, storage and MySQL integration now
    # approach 20 minutes on GitHub runners; allow cleanup to finish.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install browser for Console E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Console Agent editor E2E
        run: pnpm test:e2e:agent-editor

      - name: Protocol coverage gate
        run: pnpm test:coverage:protocol

      - name: Storage integration tests
        run: pnpm test:integration:storage

      # The official two-owner persistence test runs real Litebox microVMs.
      # Litebox aborts its host process when /dev/kvm is not accessible.
      - name: Enable KVM for Litebox
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: MySQL integration tests
        run: pnpm test:integration:mysql
