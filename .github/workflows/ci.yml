name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Full repository tests plus browser, storage and MySQL integration now
    # approach 20 minutes on GitHub runners; allow cleanup to finish.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install browser for Console E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Console Agent editor E2E
        run: pnpm test:e2e:agent-editor

      - name: Protocol coverage gate
        run: pnpm test:coverage:protocol

      - name: Storage integration tests
        run: pnpm test:integration:storage

      # The official two-owner persistence test runs real Litebox microVMs.
      # Litebox aborts its host process when /dev/kvm is not accessible.
      #
      # ubuntu-24.04 runners expose /dev/kvm as root:kvm mode 0660, and the
      # runner user is not in the kvm group. `udevadm trigger` applies a
      # 0666 rule asynchronously: the access check failed ~26ms after
      # trigger, while the mode change landed ~45ms later. `udevadm settle`
      # can also return before that uevent is queued. chmod is synchronous.
      # The udev rule keeps a later uevent from restoring 0660. A missing
      # device fails this step with an explicit error, which fails the job.
      - name: Enable KVM for Litebox
        run: |
          echo "=== Initial KVM state ==="
          ls -la /dev/kvm 2>&1 || true
          id
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist. This runner has no KVM device, so the MySQL integration tests were not run."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "Waiting for udev to settle..."
          sudo udevadm settle --timeout=10 || echo "WARN: udevadm settle timed out; setting /dev/kvm mode directly"
          # Last writer. Covers settle returning before the uevent is queued,
          # and a node udev recreated with mode 0660.
          if ! sudo chmod 666 /dev/kvm; then
            echo "::error::chmod 666 /dev/kvm failed. The MySQL integration tests were not run."
            ls -la /dev/kvm 2>&1 || true
            exit 1
          fi
          # The observed uevent landed within 50ms. Wait past that, then
          # re-assert if a late event restored 0660.
          sleep 0.5
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          echo "=== Final KVM state ==="
          ls -la /dev/kvm 2>&1 || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "SUCCESS: /dev/kvm is readable and writable"
          else
            echo "::error::/dev/kvm exists but is not readable and writable by $(id -un). The MySQL integration tests were not run."
            ls -la /dev/kvm 2>&1 || true
            id
            exit 1
          fi

      - name: MySQL integration tests
        run: pnpm test:integration:mysql
